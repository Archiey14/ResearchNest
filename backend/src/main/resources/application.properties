spring.application.name=researchnest

# Secrets and machine-specific settings live in backend/.env (git-ignored).
# Copy .env.example to .env and fill it in. Environment variables work too.
spring.config.import=optional:file:./.env[.properties]

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/researchnest}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

# --- Authentication ---
# JWT signing secret (min 32 bytes). Leave empty only for local development.
jwt.secret=${JWT_SECRET:}

# Shared secret the AI microservice (harvester) sends in the X-Service-Key header so it can
# POST /api/papers/batch without a user session. Min 16 characters; empty = feature disabled
# (then only a logged-in ADMIN can write papers).
app.internal-api-key=${INTERNAL_API_KEY:}

# Google Identity Services / OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:}

# --- Developer mode ---
# When true: OTPs are printed to the console, demo accounts are seeded,
# the demo master OTP works and fake "dev_google_*" tokens are accepted.
# Must be false (the default) anywhere other than a developer machine.
app.dev-mode=${APP_DEV_MODE:false}

# Optional: create the first administrator when dev mode is off (password min 8 chars).
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# --- Gmail SMTP (live email delivery) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
mail.from.address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:no-reply@researchnest.org}}
